name: Deploy to Firebase Hosting

on:
  push:
    tags:
      - 'v*'

jobs:
  build_and_deploy:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.47.0

      - name: Install Dependencies
        run: flutter pub get

      - name: Build eyuuncore
        run: |
          cd eyuuncore
          dart run build_runner build
          cd ..

      - name: Build app
        run: |
          dart run build_runner build

      - name: Build Flutter Web
        run: flutter build web

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/810324195553/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'firebase-adminsdk-fbsvc@eyuunapp.iam.gserviceaccount.com'
          token_format: access_token
          create_credentials_file: false

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project eyuunapp
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
